<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Administrator sign-in for Shasha Enterprises.">
  <title>Admin Sign In | Shasha Enterprises</title>
  <link rel="icon" type="image/png" href="assets/60E52ABA-7AD5-4435-8FFC-0AD6243C003D.PNG">
  <link rel="stylesheet" href="style.css">
  <!-- Removed the conflicting login.js from here -->
</head>
<body class="login-page">
  <header class="login-header container">
    <a class="brand" href="index.html" aria-label="Shasha Enterprises home">
      <img src="assets/60E52ABA-7AD5-4435-8FFC-0AD6243C003D.PNG" alt="">
      <span><strong>SHASHA&nbsp;ENTERPRISES</strong><small>Hardware • Paints • Power Tools • Electricals</small></span>
    </a>
    <a class="login-home" href="login.html">Customer sign in</a>
  </header>
  <main class="login-main container">
    <section class="login-layout" aria-labelledby="admin-page-title">
      <div class="login-visual">
        <img src="assets/IMG_6827.jpg" alt="Paint supplies at Shasha Enterprises">
        <div class="login-visual-copy">
          <span class="eyebrow">Shasha Enterprises · Madurai</span>
          <h1 id="admin-page-title">Staff access.</h1>
          <p>This sign-in is reserved for authorized store administrators.</p>
        </div>
      </div>
      <div class="login-content">
        <div class="login-heading">
          <span class="eyebrow">STAFF ACCESS</span>
          <h2>Admin login</h2>
          <p>Enter your administrator credentials.</p>
        </div>
        <div class="login-forms login-forms-single">
          <section class="login-card login-card-admin" aria-labelledby="admin-login-title">
            <h3 id="admin-login-title">Administrator sign in</h3>
            <!-- Removed the fake preview notice text -->
            <form data-login-form data-login-role="admin">
              <label class="form-field" for="admin-email">Admin email</label>
              <input id="admin-email" name="email" type="email" autocomplete="username" placeholder="admin@example.com" required>
              <label class="form-field" for="admin-password">Password</label>
              <input id="admin-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
              <button class="button button-admin button-block" type="submit">Sign in as admin</button>
              <p class="login-status" data-login-status role="status" aria-live="polite"></p>
            </form>
            <a class="login-help" href="contact.html">Admin access support</a>
            <!-- Removed the Open Local Dashboard bypass link -->
          </section>
        </div>
      </div>
    </section>
  </main>
  
  <script>
    document.querySelector('form').addEventListener('submit', function(e) {
        e.preventDefault(); 
        
        const email = document.querySelector('input[type="email"]').value;
        const password = document.querySelector('input[type="password"]').value;
        const credentials = btoa(email + ':' + password);

        fetch('http://localhost:8080/api/user', {
            method: 'GET',
            headers: { 'Authorization': 'Basic ' + credentials }
        })
        .then(response => {
            if (response.ok) return response.json();
            throw new Error("Invalid credentials");
        })
        .then(userData => {
            // ENFORCE ADMIN ROLE
            if (userData.role === 'ADMIN') {
                localStorage.setItem('adminAuthToken', 'Basic ' + credentials);
                alert("Admin login successful!");
                window.location.href = 'admin-dashboard.html'; 
            } else {
                alert("Access Denied: Your account does not have administrator privileges.");
            }
        })
        .catch(error => {
            alert("Error: Incorrect email or password.");
        });
    });
  </script>
</body>
</html>
